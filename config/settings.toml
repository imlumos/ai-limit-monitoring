# ============================================================
# AI 额度悬浮窗 - 配置文件
# ============================================================
#
# 随源码/安装包分发的默认值,不要在这里保存个人账号、密钥或代理。
# 日常设置请使用界面,用户覆盖值保存在 data/settings.toml。
# 所有平台的代理统一保存在 data/proxy.toml。
# ============================================================


# [window] 段:悬浮窗本身的视觉参数
# 段落标题用方括号包裹,后续键值对都属于这一段
[window]
width = 260          # 初始宽度(像素);用户拖拽后的宽度保存在 data/ui_state.json
height = 50          # 折叠态基准高度(像素);多源模式会随账号行数变高
corner_radius = 25   # 圆角半径(像素),25 让两端成为完整半圆


# [refresh] 段:定时刷新相关参数
# 只允许各平台代码中的默认 HTTPS 端点,不支持自定义额度地址。
[refresh]
interval_minutes = 10               # 额度数据刷新间隔(分钟)


# [update] 段:自动更新策略(打包内置的默认值)
# 用户级的"此版本不再提醒"存在 data/ui_state.json,不在这里。
[update]
enabled = false                    # 默认关闭;现有更新源仍为上游 Gitee
check_on_startup = false            # 默认不在启动时联系更新源


# [application] 段:软件名称和图标(可在"高级设置 → 软件标识"里改)
[application]
name = "AI额度悬浮窗"
icon = ""                          # 自定义图标为 data/app-icon.ico;空 = 内置图标

# [appearance] 段:悬浮窗背景外观(可在"高级设置 → 外观"里改)
[appearance]
bg_color = "#000000"                # 背景颜色(#RRGGBB)
bg_opacity = 70                     # 背景色不透明度 0~100;有背景图时作为图上的遮罩
bg_image = ""                       # 背景图文件名(位于 data/ 下,由设置界面上传;空 = 不用图)
